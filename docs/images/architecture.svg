<text class="eyebrow" x="164" y="62">OLLUPI · ARCHITECTURE</text>
<text class="title" x="164" y="104">One process hosts every session</text>
<text class="sub" x="72" y="152">Sessions, subagents and scheduled tasks share one agent's scheduler, and all state lives in SQLite</text>
<line x1="72" y1="900" x2="1528" y2="900" stroke="#e6e4de" stroke-width="2"/>
<text class="foot" x="72" y="932">Every step is written to the database before it runs</text>
<text class="foot" x="1528" y="932" text-anchor="end" style="font-family: ui-monospace, 'SF Mono', Menlo, monospace">github.com/0xfakeSpike/ollupi</text>
<rect x="560" y="196" width="480" height="60" rx="14" fill="#eef3ec" stroke="#c3d3bd" stroke-width="2"/>
<text class="hs" x="800.0" y="233.0" text-anchor="middle">ollupi-desktop · other clients</text>
<path d="M800,258 V300" fill="none" stroke="#8e928f" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M800,300 V258" fill="none" stroke="#8e928f" stroke-width="2" marker-end="url(#arrow)"/>
<text class="s" x="816.0" y="284.0" text-anchor="start">JSON-RPC 2.0 · WebSocket</text>
<rect x="360" y="302" width="880" height="64" rx="14" fill="#ffffff" stroke="#c3d3bd" stroke-width="2"/>
<text class="h code" x="392.0" y="342.0" text-anchor="start">gateway</text>
<text class="b" x="510.0" y="341.0" text-anchor="start">Request dispatch · event push · contract and method table from one source</text>
<path d="M800,368 V404" fill="none" stroke="#8e928f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="330" y="406" width="940" height="236" rx="18" fill="#eef3ec" stroke="#2f5d47" stroke-width="2"/>
<text class="h code" x="360.0" y="444.0" text-anchor="start">agent</text>
<rect x="360" y="466" width="280" height="156" rx="14" fill="#ffffff" stroke="#c3d3bd" stroke-width="2"/>
<text class="hs" x="382.0" y="504.0" text-anchor="start">Scheduler</text>
<text class="b" x="382.0" y="540.0" text-anchor="start">Shared pool, 32 slots by default</text>
<text class="b" x="382.0" y="566.0" text-anchor="start">Slots released while waiting</text>
<text class="b" x="382.0" y="592.0" text-anchor="start">Sessions before subagents</text>
<rect x="660" y="466" width="280" height="156" rx="14" fill="#ffffff" stroke="#c3d3bd" stroke-width="2"/>
<text class="hs code" x="682.0" y="504.0" text-anchor="start">runtime</text>
<text class="b" x="682.0" y="540.0" text-anchor="start">Re-reads DB before model calls</text>
<text class="b" x="682.0" y="566.0" text-anchor="start">Model call → tool execution</text>
<text class="b" x="682.0" y="592.0" text-anchor="start">Steps written before they run</text>
<rect x="960" y="466" width="280" height="156" rx="14" fill="#ffffff" stroke="#c3d3bd" stroke-width="2"/>
<text class="hs" x="982.0" y="504.0" text-anchor="start">Permissions · redaction</text>
<text class="b" x="982.0" y="540.0" text-anchor="start">Three layers of permission rules</text>
<text class="b" x="982.0" y="566.0" text-anchor="start">Seatbelt sandbox</text>
<text class="b" x="982.0" y="592.0" text-anchor="start">Secrets replaced before sending</text>
<rect x="72" y="420" width="228" height="100" rx="14" fill="#ffffff" stroke="#c3d3bd" stroke-width="2"/>
<text class="hs" x="94.0" y="456.0" text-anchor="start">Memory</text>
<text class="s" x="94.0" y="484.0" text-anchor="start">Distilled from ended turns</text>
<text class="s" x="94.0" y="508.0" text-anchor="start">Global · general · workspace</text>
