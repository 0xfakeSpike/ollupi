<text class="h" x="166.0" y="836.0" text-anchor="start">SQLite</text>
<text class="b" x="166.0" y="866.0" text-anchor="start">thread · turn · item · memory · scheduled tasks · permission rules · message full-text index</text>
<text class="hs" x="1500.0" y="836.0" text-anchor="end">Write first, then run</text>
