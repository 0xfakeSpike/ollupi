<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <style>
      text { font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif; fill: #1f2937; }
      .title { font-size: 40px; font-weight: 700; }
      .sub { font-size: 22px; fill: #64748b; }
      .h { font-size: 24px; font-weight: 600; }
      .b { font-size: 19px; fill: #475569; }
      .s { font-size: 17px; fill: #64748b; }
      .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
      .line { stroke: #64748b; stroke-width: 2; fill: none; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>

  <text class="title" x="60" y="72">Ollupi 架构</text>
  <text class="sub" x="60" y="110">一个进程承载所有对话、子代理和定时任务，状态全在 SQLite</text>

  <rect x="600" y="140" width="400" height="60" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text class="h" x="800" y="178" text-anchor="middle">ollupi-desktop · 其他客户端</text>
  <line class="line" x1="800" y1="200" x2="800" y2="242" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="s" x="816" y="228">JSON-RPC 2.0 · WebSocket</text>

  <rect x="380" y="244" width="840" height="64" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text class="h mono" x="408" y="284">gateway</text>
  <text class="b" x="530" y="284">请求分发 · 事件推送 · 一张方法表生成 protocol.schema.json</text>
  <line class="line" x1="800" y1="308" x2="800" y2="350" marker-start="url(#a)" marker-end="url(#a)"/>

  <rect x="380" y="352" width="840" height="250" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text class="h mono" x="404" y="390" style="fill:#1d4ed8">agent</text>

  <rect x="404" y="408" width="250" height="170" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text class="h" x="426" y="446">调度器</text>
  <text class="b" x="426" y="482">共享执行池</text>
  <text class="b" x="426" y="510">默认 32 个槽位</text>
  <text class="b" x="426" y="538">等待时让出槽位</text>

  <rect x="675" y="408" width="250" height="170" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text class="h mono" x="697" y="446">runtime</text>
  <text class="b" x="697" y="482">调模型前从库里重读</text>
  <text class="b" x="697" y="510">调模型 → 执行工具</text>
  <text class="b" x="697" y="538">→ 调模型 …</text>

  <rect x="946" y="408" width="250" height="170" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text class="h" x="968" y="446">权限 · 脱敏</text>
  <text class="b" x="968" y="482">三层权限规则</text>
  <text class="b" x="968" y="510">Seatbelt 沙箱</text>
  <text class="b" x="968" y="538">发给模型前换占位符</text>

  <line class="line" x1="654" y1="493" x2="673" y2="493" marker-end="url(#a)"/>
  <line class="line" x1="925" y1="493" x2="944" y2="493" marker-end="url(#a)"/>

  <rect x="60" y="352" width="270" height="115" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text class="h" x="84" y="392" style="fill:#6d28d9">记忆</text>
  <text class="b" x="84" y="424">从结束的 turn 里提炼</text>
  <text class="b" x="84" y="452">全局 · general · 工作区</text>
  <line class="line" x1="330" y1="410" x2="378" y2="410" marker-end="url(#a)"/>

  <rect x="60" y="487" width="270" height="115" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
  <text class="h" x="84" y="527" style="fill:#0f766e">定时任务</text>
  <text class="b" x="84" y="559">到点往会话发一条消息</text>
  <text class="b" x="84" y="587">和别的 turn 一样排队</text>
  <line class="line" x1="330" y1="545" x2="378" y2="545" marker-end="url(#a)"/>

  <rect x="1270" y="352" width="270" height="115" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text class="h" x="1294" y="392">模型连接</text>
  <text class="b" x="1294" y="424">OpenAI 兼容接口</text>
  <text class="b" x="1294" y="452">每个连接默认 4 路并发</text>
  <line class="line" x1="1220" y1="410" x2="1268" y2="410" marker-end="url(#a)"/>

  <rect x="1270" y="507" width="270" height="95" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
  <text class="h" x="1294" y="547">模型服务商</text>
  <text class="b" x="1294" y="579">只看到占位符</text>
  <line class="line" x1="1405" y1="467" x2="1405" y2="505" marker-start="url(#a)" marker-end="url(#a)"/>

  <line class="line" x1="830" y1="602" x2="830" y2="638" marker-end="url(#a)"/>
  <text class="s" x="846" y="626">经权限检查后调用</text>

  <rect x="440" y="640" width="180" height="90" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text class="h" x="530" y="678" text-anchor="middle" style="font-size:21px">内置工具</text>
  <text class="s" x="530" y="708" text-anchor="middle">子代理 · 计划 · 提问</text>

  <rect x="640" y="640" width="180" height="90" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text class="h mono" x="730" y="678" text-anchor="middle" style="font-size:20px">run_command</text>
  <text class="s" x="730" y="708" text-anchor="middle">在沙箱里跑</text>

  <rect x="840" y="640" width="180" height="90" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text class="h" x="930" y="678" text-anchor="middle" style="font-size:21px">MCP 服务器</text>
  <text class="s" x="930" y="708" text-anchor="middle">stdio · HTTP</text>

  <rect x="1040" y="640" width="180" height="90" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text class="h" x="1130" y="678" text-anchor="middle" style="font-size:21px">应用自己的工具</text>
  <text class="s mono" x="1130" y="708" text-anchor="middle">tools.Provider</text>

  <line class="line" x1="410" y1="602" x2="410" y2="768" marker-start="url(#a)" marker-end="url(#a)"/>
  <line class="line" x1="195" y1="602" x2="195" y2="768" marker-start="url(#a)" marker-end="url(#a)"/>

  <rect x="60" y="770" width="1480" height="90" rx="14" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <g transform="translate(88,790)">
    <ellipse cx="22" cy="8" rx="22" ry="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    <path d="M0,8 V42 A22,8 0 0 0 44,42 V8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    <path d="M0,25 A22,8 0 0 0 44,25" fill="none" stroke="#475569" stroke-width="2"/>
  </g>
  <text class="h" x="156" y="812">SQLite</text>
  <text class="b" x="156" y="842">thread · turn · item · 记忆 · 定时任务 · 权限规则</text>
  <text class="b" x="1512" y="812" text-anchor="end">先落库，再执行</text>
  <text class="b" x="1512" y="842" text-anchor="end">重启后队列和进行中的 turn 都还在</text>
</svg>
