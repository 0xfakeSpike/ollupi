<text class="hs code" x="682.0" y="504.0" text-anchor="start">runtime</text>
<text class="b" x="682.0" y="540.0" text-anchor="start">调用模型前自库中重读</text>
<text class="b" x="682.0" y="566.0" text-anchor="start">模型调用 → 工具执行</text>
<text class="b" x="682.0" y="592.0" text-anchor="start">步骤先写库再执行</text>
<rect x="960" y="466" width="280" height="156" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
