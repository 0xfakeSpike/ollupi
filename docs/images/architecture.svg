<text class="eyebrow" x="164" y="62">OLLUPI · 架构</text>
<text class="title" x="164" y="104">一个进程承载所有会话</text>
<text class="sub" x="72" y="152">会话、子代理与定时任务在同一个 agent 内调度，状态全部写入 SQLite</text>
<line x1="72" y1="900" x2="1528" y2="900" stroke="#e2e8f0" stroke-width="2"/>
<text class="foot" x="72" y="932">每一步先写入数据库，再执行</text>
<text class="foot" x="1528" y="932" text-anchor="end" style="font-family: ui-monospace, 'SF Mono', Menlo, monospace">github.com/0xfakeSpike/ollupi</text>
