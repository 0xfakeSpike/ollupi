<text class="eyebrow" x="164" y="62">OLLUPI BENCH · 容量</text>
<text class="title" x="164" y="104">约 3000 个活跃会话以内，turn 耗时与单独运行基本持平</text>
<text class="sub" x="72" y="152">闭环负载：每个会话在上一个 turn 结束后立即发起下一个。每个 turn 3 次模型调用（5 s ± 2 s）、2 次工具调用（1 s），单独运行约 17 s</text>
