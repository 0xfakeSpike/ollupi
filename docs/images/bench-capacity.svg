<text class="eyebrow" x="164" y="62">OLLUPI BENCH · CAPACITY</text>
<text class="title" x="164" y="104">Up to about 3000 active sessions, turns run about as fast as alone</text>
<text class="sub" x="72" y="152">Closed loop: each session starts a turn as soon as the last ends. A turn is 3 model calls (5 s ± 2 s) and 2 tool calls (1 s), about 17 s alone</text>
<line x1="72" y1="940" x2="1528" y2="940" stroke="#e6e4de" stroke-width="2"/>
<text class="foot" x="72" y="972">Apple M1 · 8 cores · 8 GB · one SQLite database · simulated model and tools</text>
<text class="foot" x="1528" y="972" text-anchor="end" style="font-family: ui-monospace, 'SF Mono', Menlo, monospace">go run ./bench steady -c 3072</text>
