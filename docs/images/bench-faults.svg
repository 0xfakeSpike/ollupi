<text class="eyebrow" x="164" y="62">OLLUPI BENCH · 故障与长尾</text>
<text class="title" x="164" y="104">模型请求出错或变慢时，turn 变慢但不失败</text>
<text class="sub" x="72" y="152">故障：5% 的请求返回 500，同账户其他客户端占用最多 256 个额度。长尾：模型延迟为对数正态分布，中位数 5 s，σ = 0.6</text>
