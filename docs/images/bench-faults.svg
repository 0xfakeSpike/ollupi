<text class="eyebrow" x="164" y="62">OLLUPI BENCH · FAULTS AND LONG TAIL</text>
<text class="title" x="164" y="104">When model requests fail or slow down, turns slow but don't fail</text>
<text class="sub" x="72" y="152">Faults: 5% of requests return 500, other clients on the account take up to 256 of the quota. Long tail: log-normal model latency, median 5 s, σ = 0.6</text>
<line x1="72" y1="940" x2="1528" y2="940" stroke="#e6e4de" stroke-width="2"/>
<text class="foot" x="72" y="972">Apple M1 · 8 cores · 8 GB · one SQLite database · simulated model and tools</text>
<text class="foot" x="1528" y="972" text-anchor="end" style="font-family: ui-monospace, 'SF Mono', Menlo, monospace">go run ./bench steady -fail 0.05 -others 256 | -sigma 0.6</text>
