<text class="eyebrow" x="164" y="62">OLLUPI BENCH · 内存</text>
<text class="title" x="164" y="104">会话挂起时只占数据库，不占进程内存</text>
<text class="sub" x="72" y="152">进程常驻内存（RSS）随会话数的变化，双对数坐标。对照组为每个会话一个 Ollupi 进程，未计容器开销</text>
<line x1="72" y1="940" x2="1528" y2="940" stroke="#e2e8f0" stroke-width="2"/>
<text class="foot" x="72" y="972">Apple M1 · 8 核 · 8 GB · 单个 SQLite 库 · 模型与工具为模拟</text>
<text class="foot" x="1528" y="972" text-anchor="end" style="font-family: ui-monospace, 'SF Mono', Menlo, monospace">go run ./bench parked | steady | isolated</text>
