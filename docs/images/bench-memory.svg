<text class="eyebrow" x="164" y="62">OLLUPI BENCH · MEMORY</text>
<text class="title" x="164" y="104">A parked session lives in the database, not in process memory</text>
<text class="sub" x="72" y="152">Resident memory (RSS) by session count, log-log. The control is one Ollupi process per session, not counting container overhead</text>
<line x1="72" y1="940" x2="1528" y2="940" stroke="#e6e4de" stroke-width="2"/>
<text class="foot" x="72" y="972">Apple M1 · 8 cores · 8 GB · one SQLite database · simulated model and tools</text>
<text class="foot" x="1528" y="972" text-anchor="end" style="font-family: ui-monospace, 'SF Mono', Menlo, monospace">go run ./bench parked | steady | isolated</text>
<rect x="72" y="196" width="1456" height="124" rx="16" fill="#eef3ec"/>
<text x="104.0" y="262"><tspan class="kpi">&lt; 0.3</tspan><tspan class="unit" dx="8">KB</tspan></text>
<text class="cap" x="104.0" y="296.0" text-anchor="start">per parked session (measured at 50,000 parked)</text>
<line x1="557.3333333333333" y1="222" x2="557.3333333333333" y2="294" stroke="#c3d3bd" stroke-width="2"/>
<text x="589.3333333333333" y="262"><tspan class="kpi">≈ 160</tspan><tspan class="unit" dx="8">KB</tspan></text>
<text class="cap" x="589.3" y="296.0" text-anchor="start">per active session, including its HTTP connection</text>
