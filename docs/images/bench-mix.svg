<text class="eyebrow" x="164" y="62">OLLUPI BENCH · MIXED LOAD</text>
<text class="title" x="164" y="104">Scheduled peaks queue at the model quota; off-peak turns barely wait</text>
<text class="sub" x="72" y="152">256 sessions send turns (20% to subagents) while 1000 scheduled tasks come due at once; quota 256. Fan-out: 64 turns × 8 subagents, 32 slots</text>
<line x1="72" y1="940" x2="1528" y2="940" stroke="#e2e8f0" stroke-width="2"/>
<text class="foot" x="72" y="972">Apple M1 · 8 cores · 8 GB · one SQLite database · simulated model and tools</text>
<text class="foot" x="1528" y="972" text-anchor="end" style="font-family: ui-monospace, 'SF Mono', Menlo, monospace">go run ./bench mix | fanout</text>
