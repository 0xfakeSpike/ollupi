<text class="eyebrow" x="164" y="62">OLLUPI BENCH · RECOVERY</text>
<text class="title" x="164" y="104">Process restarts and session wake-ups take milliseconds</text>
<text class="sub" x="72" y="152">Wake-up: from messaging a session idle in the database to its model request going out. Crash: 90 random kill -9s under mixed load</text>
<line x1="72" y1="940" x2="1528" y2="940" stroke="#e6e4de" stroke-width="2"/>
<text class="foot" x="72" y="972">Apple M1 · 8 cores · 8 GB · one SQLite database · simulated model and tools</text>
<text class="foot" x="1528" y="972" text-anchor="end" style="font-family: ui-monospace, 'SF Mono', Menlo, monospace">go run ./bench resume | crash</text>
