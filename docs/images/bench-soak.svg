<text class="eyebrow" x="164" y="62">OLLUPI BENCH · LONG RUN</text>
<text class="title" x="164" y="104">Goroutines and WAL stay flat; CPU and memory grow with session history</text>
<text class="sub" x="72" y="152">256 sessions run for 8 minutes, 35,000 turns in all, each lengthening its session's history. Model calls 1 s ± 0.2 s, tool calls 0.2 s</text>
<line x1="72" y1="940" x2="1528" y2="940" stroke="#e6e4de" stroke-width="2"/>
<text class="foot" x="72" y="972">Apple M1 · 8 cores · 8 GB · one SQLite database · simulated model and tools</text>
<text class="foot" x="1528" y="972" text-anchor="end" style="font-family: ui-monospace, 'SF Mono', Menlo, monospace">go run ./bench soak -c 256 -d 8m -every 30s -latency 1s -jitter 200ms -tool 200ms</text>
