<text class="eyebrow" x="164" y="62">OLLUPI BENCH · 长时间运行</text>
<text class="title" x="164" y="104">goroutine 与 WAL 不随时间增长，CPU 与内存随会话历史增长</text>
<text class="sub" x="72" y="152">256 个会话连续运行 8 分钟，共 3.5 万个 turn，每个 turn 都加长所在会话的历史。模型调用 1 s ± 0.2 s，工具调用 0.2 s</text>
<line x1="72" y1="940" x2="1528" y2="940" stroke="#e2e8f0" stroke-width="2"/>
<text class="foot" x="72" y="972">Apple M1 · 8 核 · 8 GB · 单个 SQLite 库 · 模型与工具为模拟</text>
<text class="foot" x="1528" y="972" text-anchor="end" style="font-family: ui-monospace, 'SF Mono', Menlo, monospace">go run ./bench soak -c 256 -d 8m -every 30s -latency 1s -jitter 200ms -tool 200ms</text>
