<text class="eyebrow" x="164" y="62">OLLUPI · 对比</text>
<text class="title" x="164" y="104">同样的机器，承载更多会话</text>
<text class="sub" x="72" y="152">逐个隔离时，等待中的 agent 仍占用一个进程；Ollupi 在等待时释放槽位，由其他 turn 接续</text>
