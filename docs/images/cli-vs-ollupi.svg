<rect x="610.4" y="368" width="139.6" height="44" rx="8" fill="url(#hatch)" stroke="#cfccc3" stroke-width="1.5"/>
<text class="s" x="680.2" y="396.0" text-anchor="middle">awaiting approval</text>
<text class="lab" x="216.0" y="458.0" text-anchor="end">Process 3</text>
<rect x="236.0" y="432" width="181.2" height="44" rx="8" fill="#f43f5e"/>
<text class="chip" x="326.6" y="460.0" text-anchor="middle" style="fill:#ffffff">C</text>
<rect x="423.2" y="432" width="191.6" height="44" rx="8" fill="url(#hatch)" stroke="#cfccc3" stroke-width="1.5"/>
<text class="s" x="519.0" y="460.0" text-anchor="middle">awaiting answer</text>
