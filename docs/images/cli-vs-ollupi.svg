<text class="lab" x="960.0" y="394.0" text-anchor="end">Slot 2</text>
<rect x="980.0" y="368" width="98.0" height="44" rx="8" fill="#2f5d47"/>
<text class="chip" x="1029.0" y="396.0" text-anchor="middle" style="fill:#ffffff">B</text>
<rect x="1084.0" y="368" width="191.6" height="44" rx="8" fill="#2f5d47"/>
<text class="chip" x="1179.8" y="396.0" text-anchor="middle" style="fill:#ffffff">E</text>
<rect x="1281.6" y="368" width="98.0" height="44" rx="8" fill="#2f5d47"/>
<text class="chip" x="1330.6" y="396.0" text-anchor="middle" style="fill:#ffffff">B</text>
<rect x="1385.6" y="368" width="108.4" height="44" rx="8" fill="#2f5d47"/>
<text class="chip" x="1439.8" y="396.0" text-anchor="middle" style="fill:#ffffff">D</text>
