<text class="chip" x="1138.2" y="332.0" text-anchor="middle" style="fill:#ffffff">D</text>
<rect x="1198.4" y="304" width="98.0" height="44" rx="8" fill="#2f5d47"/>
<text class="chip" x="1247.4" y="332.0" text-anchor="middle" style="fill:#ffffff">Scheduled</text>
<rect x="1302.4" y="304" width="98.0" height="44" rx="8" fill="#2f5d47"/>
<text class="chip" x="1351.4" y="332.0" text-anchor="middle" style="fill:#ffffff">A</text>
