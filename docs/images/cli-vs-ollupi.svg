<text class="chip" x="685.4" y="460.0" text-anchor="middle" style="fill:#ffffff">C</text>
<text class="lab" x="216.0" y="522.0" text-anchor="end">Sessions D, E</text>
<rect x="236" y="496" width="514" height="44" rx="8" fill="#ffffff" stroke="#fecdd3" stroke-width="2" stroke-dasharray="8 6"/>
<text class="s" x="493.0" y="524.0" text-anchor="middle">Each needs a new process</text>
<text class="lab" x="960.0" y="330.0" text-anchor="end">Slot 1</text>
<rect x="980.0" y="304" width="98.0" height="44" rx="8" fill="#2f5d47"/>
<text class="chip" x="1029.0" y="332.0" text-anchor="middle" style="fill:#ffffff">A</text>
