<rect x="980.0" y="432" width="150.0" height="44" rx="8" fill="#2f5d47"/>
<text class="chip" x="1055.0" y="460.0" text-anchor="middle" style="fill:#ffffff">C</text>
<rect x="1136.0" y="432" width="222.8" height="44" rx="8" fill="#2f5d47"/>
<text class="chip" x="1247.4" y="460.0" text-anchor="middle" style="fill:#ffffff">D's subagent</text>
<rect x="1364.8" y="432" width="129.2" height="44" rx="8" fill="#2f5d47"/>
<text class="chip" x="1429.4" y="460.0" text-anchor="middle" style="fill:#ffffff">C</text>
<text class="lab" x="960.0" y="516.0" text-anchor="end">Waiting</text>
<text class="s" x="960.0" y="538.0" text-anchor="end">No slot held</text>
<rect x="980.0" y="496" width="150" height="30" rx="8" fill="url(#hatch)" stroke="#cfccc3" stroke-width="1.5"/>
<text class="s" x="1055.0" y="517.0" text-anchor="middle">A awaits approval</text>
<rect x="1156.8" y="496" width="150" height="30" rx="8" fill="url(#hatch)" stroke="#cfccc3" stroke-width="1.5"/>
<text class="s" x="1231.8" y="517.0" text-anchor="middle">B awaits answer</text>
<rect x="1333.6" y="496" width="150" height="30" rx="8" fill="url(#hatch)" stroke="#cfccc3" stroke-width="1.5"/>
<text class="s" x="1408.6" y="517.0" text-anchor="middle">B awaits approval</text>
<rect x="1068.4" y="534" width="150" height="30" rx="8" fill="url(#hatch)" stroke="#cfccc3" stroke-width="1.5"/>
<text class="s" x="1143.4" y="555.0" text-anchor="middle">C awaits answer</text>
<line x1="104" y1="608" x2="752" y2="608" stroke="#fecdd3" stroke-width="2"/>
<rect x="106" y="633" width="8" height="8" fill="#f43f5e"/>
<text class="b" x="128.0" y="640.0" text-anchor="start">One process hosts only one session</text>
<rect x="106" y="669" width="8" height="8" fill="#f43f5e"/>
<text class="b" x="128.0" y="676.0" text-anchor="start">A waiting process sits suspended, still holding memory</text>
<rect x="106" y="705" width="8" height="8" fill="#f43f5e"/>
<text class="b" x="128.0" y="712.0" text-anchor="start">Scheduling state is in memory, lost when the process exits</text>
<rect x="106" y="741" width="8" height="8" fill="#f43f5e"/>
<text class="b" x="128.0" y="748.0" text-anchor="start">Scheduled tasks need an external cron to start a process</text>
<line x1="848" y1="608" x2="1496" y2="608" stroke="#c3d3bd" stroke-width="2"/>
<rect x="850" y="633" width="8" height="8" fill="#2f5d47"/>
<text class="b" x="872.0" y="640.0" text-anchor="start">One process runs every session, subagent and scheduled task</text>
<rect x="850" y="669" width="8" height="8" fill="#2f5d47"/>
<text class="b" x="872.0" y="676.0" text-anchor="start">A waiting turn releases its slot and another turn takes over</text>
<rect x="850" y="705" width="8" height="8" fill="#2f5d47"/>
<text class="b" x="872.0" y="712.0" text-anchor="start">Scheduling state is in SQLite; a restart resumes where it stopped</text>
<rect x="850" y="741" width="8" height="8" fill="#2f5d47"/>
<text class="b" x="872.0" y="748.0" text-anchor="start">Scheduled tasks message a session when due and share the queue</text>
</svg>
