<text class="chip" x="680.2" y="332.0" text-anchor="middle" style="fill:#ffffff">A</text>
<text class="lab" x="216.0" y="394.0" text-anchor="end">Process 2</text>
<rect x="236.0" y="368" width="98.0" height="44" rx="8" fill="#f43f5e"/>
<text class="chip" x="285.0" y="396.0" text-anchor="middle" style="fill:#ffffff">B</text>
<rect x="340.0" y="368" width="150.0" height="44" rx="8" fill="url(#hatch)" stroke="#cfccc3" stroke-width="1.5"/>
<text class="s" x="415.0" y="396.0" text-anchor="middle">awaiting answer</text>
