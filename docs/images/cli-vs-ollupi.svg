41"/></g></svg>
<text class="eyebrow" x="164" y="62">OLLUPI · COMPARISON</text>
<text class="title" x="164" y="104">The same machine hosts more sessions</text>
<text class="sub" x="72" y="152">Isolated, a waiting agent still holds a process; Ollupi releases the slot while waiting, and another turn takes over</text>
<line x1="72" y1="880" x2="1528" y2="880" stroke="#e6e4de" stroke-width="2"/>
<text class="foot" x="72" y="912">Letters are sessions; hatching is waiting</text>
<text class="foot" x="1528" y="912" text-anchor="end" style="font-family: ui-monospace, 'SF Mono', Menlo, monospace">github.com/0xfakeSpike/ollupi</text>
<rect x="72" y="196" width="712" height="600" rx="18" fill="#fff1f2" stroke="#fecdd3" stroke-width="2"/>
<text class="h" x="104.0" y="242.0" text-anchor="start">Per-agent isolation</text>
<text class="s" x="104.0" y="272.0" text-anchor="start">One VM or container per agent</text>
<rect x="816" y="196" width="712" height="600" rx="18" fill="#eef3ec" stroke="#c3d3bd" stroke-width="2"/>
<text class="h" x="848.0" y="242.0" text-anchor="start">Ollupi</text>
<text class="s" x="848.0" y="272.0" text-anchor="start">One process, one shared execution pool</text>
<text class="lab" x="216.0" y="330.0" text-anchor="end">Process 1</text>
