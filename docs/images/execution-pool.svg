<text class="eyebrow" x="164" y="62">OLLUPI · 执行池</text>
<text class="title" x="164" y="104">所有 turn 共用一个执行池</text>
<text class="sub" x="72" y="152">等待时释放槽位，模型并发只分配给正在调用模型的 turn</text>
