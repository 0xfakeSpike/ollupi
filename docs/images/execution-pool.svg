<style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #22252a; } .eyebrow { font-size: 16px; font-weight: 600; letter-spacing: 3px; fill: #2f5d47; } .title { font-size: 36px; font-weight: 700; } .sub { font-size: 19px; fill: #5b5f66; } .kpi { font-size: 44px; font-weight: 700; letter-spacing: -0.5px; } .unit { font-size: 21px; font-weight: 600; fill: #3d4148; } .cap { font-size: 17px; fill: #5b5f66; } .h { font-size: 22px; font-weight: 700; } .hs { font-size: 19px; font-weight: 600; } .b { font-size: 17px; fill: #3d4148; } .s { font-size: 15px; fill: #5b5f66; } .code { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-weight: 700; fill: #2f5d47; } .tick { font-size: 16px; fill: #5b5f66; } .lab { font-size: 17px; fill: #3d4148; } .val { font-size: 17px; font-weight: 600; } .chip { font-size: 15px; font-weight: 600; } .foot { font-size: 15px; fill: #8e928f; }</style>
