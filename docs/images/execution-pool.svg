<text class="eyebrow" x="164" y="62">OLLUPI · EXECUTION POOL</text>
<text class="title" x="164" y="104">Every turn shares one execution pool</text>
<text class="sub" x="72" y="152">Waiting turns release their slots, and model concurrency goes only to turns calling the model</text>
<line x1="72" y1="880" x2="1528" y2="880" stroke="#e6e4de" stroke-width="2"/>
<text class="foot" x="72" y="912">An agent spends most of its time waiting on the model; the pool keeps as many model calls in flight as it can</text>
<text class="foot" x="1528" y="912" text-anchor="end" style="font-family: ui-monospace, 'SF Mono', Menlo, monospace">github.com/0xfakeSpike/ollupi</text>
<rect x="72" y="236" width="228" height="90" rx="14" fill="#ffffff" stroke="#c3d3bd" stroke-width="2"/>
<text class="hs" x="96.0" y="274.0" text-anchor="start">User messages</text>
<text class="s" x="96.0" y="302.0" text-anchor="start">Any session</text>
<path d="M300,281 C340,281 340,392 372,392" fill="none" stroke="#8e928f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="72" y="354" width="228" height="90" rx="14" fill="#ffffff" stroke="#c3d3bd" stroke-width="2"/>
<text class="hs" x="96.0" y="392.0" text-anchor="start">Subagents</text>
<text class="s" x="96.0" y="420.0" text-anchor="start">Plain sessions and turns</text>
<path d="M300,399 C340,399 340,392 372,392" fill="none" stroke="#8e928f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="72" y="472" width="228" height="90" rx="14" fill="#ffffff" stroke="#c3d3bd" stroke-width="2"/>
<text class="hs" x="96.0" y="510.0" text-anchor="start">Scheduled tasks</text>
<text class="s" x="96.0" y="538.0" text-anchor="start">Sends a message when due</text>
<path d="M300,517 C340,517 340,392 372,392" fill="none" stroke="#8e928f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="376" y="212" width="300" height="380" rx="18" fill="#eef3ec" stroke="#c3d3bd" stroke-width="2"/>
<text class="h" x="400.0" y="252.0" text-anchor="start">Queue</text>
<text class="s" x="400.0" y="280.0" text-anchor="start">Runnable turns in the database</text>
<rect x="400" y="300" width="252" height="42" rx="10" fill="#ffffff" stroke="#c3d3bd" stroke-width="2"/>
<text class="b" x="418.0" y="327.0" text-anchor="start">Session A · turn 3</text>
<rect x="400" y="354" width="252" height="42" rx="10" fill="#ffffff" stroke="#c3d3bd" stroke-width="2"/>
<text class="b" x="418.0" y="381.0" text-anchor="start">Session B · turn 1</text>
<rect x="400" y="408" width="252" height="42" rx="10" fill="#ffffff" stroke="#c3d3bd" stroke-width="2"/>
<text class="b" x="418.0" y="435.0" text-anchor="start">Subagent A-1</text>
<rect x="400" y="462" width="252" height="42" rx="10" fill="#ffffff" stroke="#c3d3bd" stroke-width="2"/>
<text class="b" x="418.0" y="489.0" text-anchor="start">Subagent A-2</text>
<rect x="400" y="516" width="252" height="42" rx="10" fill="#ffffff" stroke="#c3d3bd" stroke-width="2"/>
<text class="b" x="418.0" y="543.0" text-anchor="start">Scheduled · daily digest</text>
<text class="s" x="376.0" y="618.0" text-anchor="start">When slots are full, sessions run</text>
<text class="s" x="376.0" y="642.0" text-anchor="start">before subagents; within each kind,</text>
<text class="s" x="376.0" y="666.0" text-anchor="start">turns run in ready order</text>
<path d="M678,402 H716" fill="none" stroke="#8e928f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="720" y="212" width="420" height="380" rx="18" fill="#ffffff" stroke="#2f5d47" stroke-width="2"/>
<text class="h" x="744.0" y="252.0" text-anchor="start">Slots</text>
<text class="s" x="744.0" y="280.0" text-anchor="start">32 by default; one per turn, released when waiting</text>
