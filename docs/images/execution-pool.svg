<text class="eyebrow" x="164" y="62">OLLUPI · EXECUTION POOL</text>
<text class="title" x="164" y="104">Every turn shares one execution pool</text>
<text class="sub" x="72" y="152">Waiting turns release their slots, and model concurrency goes only to turns calling the model</text>
<line x1="72" y1="880" x2="1528" y2="880" stroke="#e2e8f0" stroke-width="2"/>
<text class="foot" x="72" y="912">An agent spends most of its time waiting on the model; the pool keeps as many model calls in flight as it can</text>
<text class="foot" x="1528" y="912" text-anchor="end" style="font-family: ui-monospace, 'SF Mono', Menlo, monospace">github.com/0xfakeSpike/ollupi</text>
<rect x="72" y="236" width="228" height="90" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
<text class="hs" x="96.0" y="274.0" text-anchor="start">User messages</text>
<text class="s" x="96.0" y="302.0" text-anchor="start">Any session</text>
<path d="M300,281 C340,281 340,392 372,392" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="72" y="354" width="228" height="90" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
<text class="hs" x="96.0" y="392.0" text-anchor="start">Subagents</text>
<text class="s" x="96.0" y="420.0" text-anchor="start">Plain sessions and turns</text>
