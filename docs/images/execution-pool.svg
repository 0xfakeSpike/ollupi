<rect x="72" y="472" width="228" height="90" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
<text class="hs" x="96.0" y="510.0" text-anchor="start">Scheduled tasks</text>
<text class="s" x="96.0" y="538.0" text-anchor="start">Sends a message when due</text>
<path d="M300,517 C340,517 340,392 372,392" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="376" y="212" width="300" height="380" rx="18" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
<text class="h" x="400.0" y="252.0" text-anchor="start">Queue</text>
<text class="s" x="400.0" y="280.0" text-anchor="start">Runnable turns in the database</text>
<rect x="400" y="300" width="252" height="42" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
<text class="b" x="418.0" y="327.0" text-anchor="start">Session A · turn 3</text>
<rect x="400" y="354" width="252" height="42" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
<text class="b" x="418.0" y="381.0" text-anchor="start">Session B · turn 1</text>
<rect x="400" y="408" width="252" height="42" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
<text class="b" x="418.0" y="435.0" text-anchor="start">Subagent A-1</text>
<rect x="400" y="462" width="252" height="42" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
<text class="b" x="418.0" y="489.0" text-anchor="start">Subagent A-2</text>
<rect x="400" y="516" width="252" height="42" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
<text class="b" x="418.0" y="543.0" text-anchor="start">Scheduled · daily digest</text>
<text class="s" x="376.0" y="618.0" text-anchor="start">When slots are full, sessions run</text>
<text class="s" x="376.0" y="642.0" text-anchor="start">before subagents; within each kind,</text>
<text class="s" x="376.0" y="666.0" text-anchor="start">turns run in ready order</text>
<path d="M678,402 H716" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="720" y="212" width="420" height="380" rx="18" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
<text class="h" x="744.0" y="252.0" text-anchor="start">Slots</text>
<text class="s" x="744.0" y="280.0" text-anchor="start">32 by default; one per turn, released when waiting</text>
