<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <style>
      text { font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif; fill: #1f2937; }
      .title { font-size: 40px; font-weight: 700; }
      .sub { font-size: 22px; fill: #64748b; }
      .h { font-size: 24px; font-weight: 600; }
      .b { font-size: 19px; fill: #475569; }
      .s { font-size: 17px; fill: #64748b; }
      .chip { font-size: 17px; font-weight: 500; }
      .line { stroke: #64748b; stroke-width: 2; fill: none; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>

  <text class="title" x="60" y="72">共享执行池</text>
  <text class="sub" x="60" y="110">所有对话、子代理、定时任务的 turn 排同一个队；等人时让出槽位，模型名额只给正在调模型的 turn</text>

  <!-- sources -->
  <rect x="60" y="200" width="230" height="86" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text class="h" x="84" y="237" style="fill:#1d4ed8">用户消息</text>
  <text class="s" x="84" y="267">任意多个会话</text>
  <rect x="60" y="310" width="230" height="86" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text class="h" x="84" y="347" style="fill:#6d28d9">子代理</text>
  <text class="s" x="84" y="377">也是普通的会话和 turn</text>
  <rect x="60" y="420" width="230" height="86" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
  <text class="h" x="84" y="457" style="fill:#0f766e">定时任务</text>
  <text class="s" x="84" y="487">到点往会话发一条消息</text>
  <path class="line" d="M290,243 C335,243 335,330 378,330" marker-end="url(#a)"/>
  <line class="line" x1="290" y1="353" x2="378" y2="353" marker-end="url(#a)"/>
  <path class="line" d="M290,463 C335,463 335,376 378,376" marker-end="url(#a)"/>

  <!-- queue -->
  <rect x="380" y="180" width="270" height="346" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text class="h" x="404" y="218">队列</text>
  <text class="s" x="404" y="246">库里所有能往前走的 turn</text>
  <rect x="404" y="270" width="222" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="chip" x="420" y="296" style="fill:#1d4ed8">会话 A · 第 3 轮</text>
  <rect x="404" y="320" width="222" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="chip" x="420" y="346" style="fill:#1d4ed8">会话 B · 第 1 轮</text>
  <rect x="404" y="370" width="222" height="40" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text class="chip" x="420" y="396" style="fill:#6d28d9">子代理 A-1</text>
  <rect x="404" y="420" width="222" height="40" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text class="chip" x="420" y="446" style="fill:#6d28d9">子代理 A-2</text>
  <rect x="404" y="470" width="222" height="40" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text class="chip" x="420" y="496" style="fill:#0f766e">定时任务 · 每日汇总</text>
  <text class="s" x="380" y="562">槽位满时：普通会话先于子代理</text>
  <text class="s" x="380" y="590">同类先开始的先走</text>

  <line class="line" x1="650" y1="353" x2="718" y2="353" marker-end="url(#a)"/>

  <!-- slots -->
  <rect x="720" y="180" width="420" height="346" rx="14" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text class="h" x="744" y="218">槽位（默认 32 个）</text>
  <text class="s" x="744" y="246">一个 turn 占一个，不等人</text>
  <rect x="744" y="272" width="38" height="38" rx="7" fill="#3b82f6" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="792" y="272" width="38" height="38" rx="7" fill="#10b981" stroke="#059669" stroke-width="1.5"/>
  <rect x="840" y="272" width="38" height="38" rx="7" fill="#3b82f6" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="888" y="272" width="38" height="38" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="936" y="272" width="38" height="38" rx="7" fill="#10b981" stroke="#059669" stroke-width="1.5"/>
  <rect x="984" y="272" width="38" height="38" rx="7" fill="#3b82f6" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="1032" y="272" width="38" height="38" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="1080" y="272" width="38" height="38" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="744" y="320" width="38" height="38" rx="7" fill="#10b981" stroke="#059669" stroke-width="1.5"/>
  <rect x="792" y="320" width="38" height="38" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="840" y="320" width="38" height="38" rx="7" fill="#3b82f6" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="888" y="320" width="38" height="38" rx="7" fill="#3b82f6" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="936" y="320" width="38" height="38" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="984" y="320" width="38" height="38" rx="7" fill="#10b981" stroke="#059669" stroke-width="1.5"/>
  <rect x="1032" y="320" width="38" height="38" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="1080" y="320" width="38" height="38" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="744" y="368" width="38" height="38" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="792" y="368" width="38" height="38" rx="7" fill="#3b82f6" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="840" y="368" width="38" height="38" rx="7" fill="#10b981" stroke="#059669" stroke-width="1.5"/>
  <rect x="888" y="368" width="38" height="38" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="936" y="368" width="38" height="38" rx="7" fill="#10b981" stroke="#059669" stroke-width="1.5"/>
  <rect x="984" y="368" width="38" height="38" rx="7" fill="#3b82f6" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="1032" y="368" width="38" height="38" rx="7" fill="#3b82f6" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="1080" y="368" width="38" height="38" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="744" y="416" width="38" height="38" rx="7" fill="#10b981" stroke="#059669" stroke-width="1.5"/>
  <rect x="792" y="416" width="38" height="38" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="840" y="416" width="38" height="38" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="888" y="416" width="38" height="38" rx="7" fill="#10b981" stroke="#059669" stroke-width="1.5"/>
  <rect x="936" y="416" width="38" height="38" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="984" y="416" width="38" height="38" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="1032" y="416" width="38" height="38" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="1080" y="416" width="38" height="38" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="744" y="480" width="18" height="18" rx="4" fill="#3b82f6"/>
  <text class="s" x="770" y="496">调模型</text>
  <rect x="866" y="480" width="18" height="18" rx="4" fill="#10b981"/>
  <text class="s" x="892" y="496">执行工具</text>
  <rect x="1004" y="480" width="18" height="18" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="s" x="1030" y="496">空闲</text>

  <line class="line" x1="1140" y1="353" x2="1198" y2="353" marker-end="url(#a)"/>

  <!-- model permits -->
  <rect x="1200" y="180" width="340" height="346" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text class="h" x="1224" y="218">模型名额</text>
  <text class="s" x="1224" y="246">按连接计，默认每个连接 4 个</text>
  <text class="b" x="1224" y="296">连接 A</text>
  <rect x="1224" y="310" width="62" height="34" rx="6" fill="#3b82f6" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="1300" y="310" width="62" height="34" rx="6" fill="#3b82f6" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="1376" y="310" width="62" height="34" rx="6" fill="#3b82f6" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="1452" y="310" width="62" height="34" rx="6" fill="#3b82f6" stroke="#2563eb" stroke-width="1.5"/>
  <text class="b" x="1224" y="396">连接 B</text>
  <rect x="1224" y="410" width="62" height="34" rx="6" fill="#3b82f6" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="1300" y="410" width="62" height="34" rx="6" fill="#3b82f6" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="1376" y="410" width="62" height="34" rx="6" fill="#3b82f6" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="1452" y="410" width="62" height="34" rx="6" fill="#3b82f6" stroke="#2563eb" stroke-width="1.5"/>
  <text class="s" x="1224" y="488">工具执行不占名额</text>
  <text class="s" x="1224" y="512">跑十分钟测试，也不挡别人调模型</text>

  <!-- waiting -->
  <line x1="930" y1="526" x2="930" y2="638" stroke="#d97706" stroke-width="2" marker-end="url(#w)"/>
  <text class="s" x="946" y="590" style="fill:#b45309">需要审批 / 提问 / 子代理</text>
  <rect x="720" y="640" width="420" height="150" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" stroke-dasharray="9 6"/>
  <text class="h" x="744" y="678" style="fill:#b45309">等待中</text>
  <text class="s" x="744" y="706">让出槽位 · 不占 goroutine · 不占模型名额</text>
  <rect x="744" y="726" width="118" height="40" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text class="chip" x="803" y="752" text-anchor="middle" style="fill:#b45309">等审批</text>
  <rect x="874" y="726" width="118" height="40" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text class="chip" x="933" y="752" text-anchor="middle" style="fill:#b45309">等回答</text>
  <rect x="1004" y="726" width="118" height="40" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text class="chip" x="1063" y="752" text-anchor="middle" style="fill:#b45309">等子代理</text>
  <path d="M720,715 H636 V528" stroke="#d97706" stroke-width="2" fill="none" marker-end="url(#w)"/>
  <text class="s" x="622" y="690" text-anchor="end" style="fill:#b45309">批准、回答、子代理报告到达</text>
  <text class="s" x="622" y="716" text-anchor="end" style="fill:#b45309">重新入队</text>

  <text x="800" y="856" text-anchor="middle" style="font-size:22px;font-weight:600;fill:#334155">agent 的时间几乎都花在等模型上：让同时进行的模型调用尽量多</text>
</svg>
