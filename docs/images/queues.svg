<text class="st" x="40.0" y="384.0" text-anchor="start">SQLite：一个写连接，提交了才算数、重启也不丢；队列 ①② 和会话日志在同一个事务里写。读走另外 4 个只读连接，不排写队列</text>
<rect x="70" y="398" width="380" height="104" rx="10" fill="#f1ecff" stroke="#7a5cc7" stroke-width="1.8"/>
