<text class="n" x="260.0" y="784.0" text-anchor="middle">admit：回 SQLite 读队列 ①，按空槽位起 Runner</text>
<text class="a" x="260.0" y="806.0" text-anchor="middle">槽位有总数和每个用户两道上限；</text>
<text class="a" x="260.0" y="825.0" text-anchor="middle">在跑的会话跳过，占满了就等有人让出</text>
<rect x="510" y="760" width="440" height="108" rx="10" fill="#eaf7ed" stroke="#3c8b53" stroke-width="1.4"/>
<text class="n" x="730.0" y="784.0" text-anchor="middle">admit：回 SQLite 读队列 ②，按空槽位起任务</text>
<text class="a" x="730.0" y="806.0" text-anchor="middle">槽位同样分总数和每个用户；</text>
<text class="a" x="730.0" y="825.0" text-anchor="middle">已经在跑的任务跳过</text>
<rect x="1010" y="760" width="380" height="108" rx="10" fill="#f1ecff" stroke="#7a5cc7" stroke-width="1.8"/>
<text class="q" x="1200.0" y="784.0" text-anchor="middle">outbox：每条连接一个，在内存里</text>
