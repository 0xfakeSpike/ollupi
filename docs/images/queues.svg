<text class="a" x="260.0" y="402.0" text-anchor="middle">顶层会话优先，再按 runnable_since 先后</text>
<rect x="540" y="326" width="380" height="104" rx="10" fill="#f1ecff" stroke="#7a5cc7" stroke-width="1.8"/>
