<text class="ev" x="1140.0" y="530.0" text-anchor="middle">这个用户的所有事件 + Delta</text>
<rect x="727.8" y="552" width="514.4" height="28" rx="8" fill="#ffffff" fill-opacity=".92"/>
<text class="rv" x="985.0" y="571.0" text-anchor="middle">store.Feed 总线：广播。按提交顺序调每个订阅者，不落库，没人听就没了</text>
<rect x="40" y="632" width="440" height="88" rx="10" fill="#eaf7ed" stroke="#3c8b53" stroke-width="1.4"/>
<text class="n" x="260.0" y="656.0" text-anchor="middle">schedule.Threads 听到 → 发唤醒信号</text>
<text class="a" x="260.0" y="678.0" text-anchor="middle">信号是容量为 1 的 channel：</text>
<text class="a" x="260.0" y="697.0" text-anchor="middle">连着叫醒几次，只合并成一次</text>
<rect x="510" y="632" width="440" height="88" rx="10" fill="#eaf7ed" stroke="#3c8b53" stroke-width="1.4"/>
<text class="n" x="730.0" y="656.0" text-anchor="middle">schedule.Tasks 听到 → 发唤醒信号</text>
<text class="a" x="730.0" y="678.0" text-anchor="middle">同样是容量为 1 的 channel</text>
<text class="a" x="730.0" y="697.0" text-anchor="middle">（和 ① 是两个调度器、两组槽位）</text>
<rect x="980" y="632" width="440" height="88" rx="10" fill="#eaf7ed" stroke="#3c8b53" stroke-width="1.4"/>
<text class="n" x="1200.0" y="656.0" text-anchor="middle">gateway：每条连接各订阅一次（按用户）</text>
<text class="a" x="1200.0" y="678.0" text-anchor="middle">把事件翻成通知，要审批、要提问时</text>
<text class="a" x="1200.0" y="697.0" text-anchor="middle">翻成发给客户端的请求</text>
