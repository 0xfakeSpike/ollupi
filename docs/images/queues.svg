<style>text{font-family:-apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;fill:#1f2430} .title{font-size:22px;font-weight:700} .sub{font-size:14px;fill:#5a6070} .head{font-size:16px;font-weight:700;fill:#163a66} .n{font-size:13px;font-weight:700} .q{font-size:13px;font-weight:700;fill:#4b2f99} .a{font-size:13px;fill:#4a4f5c} .qt{font-size:12px;font-weight:600;fill:#7a5cc7} .ev{font-family:ui-monospace, "SF Mono", Menlo, monospace;font-size:12.5px;font-weight:700;fill:#163a66} .st{font-size:13px;font-weight:600;fill:#163a66} .rv{font-size:14px;font-weight:700;fill:#163a66} .tiny{font-size:12px;fill:#3978b8} .note{font-size:13.5px;fill:#4a4f5c}</style>
<rect width="1500" height="1228" rx="16" fill="#ffffff"/>
<text class="title" x="40" y="48">队列和总线</text>
<text class="sub" x="40" y="76">紫色是放工作的队列：两个在 SQLite 里，一个在每条连接的内存里。蓝色是只排先后的队列：写队列，和总线 store.Feed 里的事件队列。</text>
<text class="head" x="260.0" y="124.0" text-anchor="middle">① 轮次队列（会话的运行队列）</text>
<text class="head" x="730.0" y="124.0" text-anchor="middle">② 后台任务队列（工具的执行队列）</text>
<text class="head" x="1200.0" y="124.0" text-anchor="middle">③ 每个连接的发送队列（给客户端）</text>
<rect x="40" y="140" width="440" height="108" rx="10" fill="#fff4df" stroke="#c98b2e" stroke-width="1.4"/>
<text class="n" x="260.0" y="164.0" text-anchor="middle">写入方：app、Runner、汇报……</text>
<text class="a" x="260.0" y="186.0" text-anchor="middle">往会话日志追加条目；折叠出的视图可运行，</text>
<text class="a" x="260.0" y="205.0" text-anchor="middle">就在同一个事务里给会话置 runnable_since</text>
<text class="a" x="260.0" y="224.0" text-anchor="middle">（新消息、审批、回答、子 agent 和任务汇报）</text>
<rect x="510" y="140" width="440" height="108" rx="10" fill="#fff4df" stroke="#c98b2e" stroke-width="1.4"/>
<text class="n" x="730.0" y="164.0" text-anchor="middle">写入方：Runner 跑到后台工具</text>
<text class="a" x="730.0" y="186.0" text-anchor="middle">同一个事务里写 TaskLaunched 条目，</text>
<text class="a" x="730.0" y="205.0" text-anchor="middle">再往 tasks 表插一行</text>
<text class="a" x="730.0" y="224.0" text-anchor="middle">（普通工具不进这里，见下）</text>
<rect x="980" y="140" width="440" height="108" rx="10" fill="#fff4df" stroke="#c98b2e" stroke-width="1.4"/>
<text class="n" x="1200.0" y="164.0" text-anchor="middle">写入方：所有写 store 的地方</text>
<text class="a" x="1200.0" y="186.0" text-anchor="middle">每次提交都会变成这个用户的事件；</text>
<text class="a" x="1200.0" y="205.0" text-anchor="middle">另有 Runner 边收边发的 Delta，</text>
<text class="a" x="1200.0" y="224.0" text-anchor="middle">不进事务，直接放进总线的事件队列</text>
<rect x="26" y="282" width="1448" height="44" rx="10" fill="#ffffff" stroke="#3978b8" stroke-width="1.8"/>
