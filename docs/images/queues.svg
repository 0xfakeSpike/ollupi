<rect x="485" y="610" width="20" height="84" rx="4" fill="#ffffff"/>
<text class="qt" x="495" y="652" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 495 652)">回 store 读</text>
<rect x="40" y="908" width="440" height="88" rx="10" fill="#eaf7ed" stroke="#3c8b53" stroke-width="1.4"/>
<text class="n" x="260.0" y="932.0" text-anchor="middle">Runner 在槽位里跑一段</text>
<text class="a" x="260.0" y="954.0" text-anchor="middle">跑完或要等人就返回、让出槽位；</text>
<text class="a" x="260.0" y="973.0" text-anchor="middle">不再可运行时清掉 runnable_since</text>
<rect x="510" y="908" width="440" height="88" rx="10" fill="#eaf7ed" stroke="#3c8b53" stroke-width="1.4"/>
<text class="n" x="730.0" y="932.0" text-anchor="middle">在用户沙箱里执行这个工具</text>
<text class="a" x="730.0" y="954.0" text-anchor="middle">一个事务里删掉这一行，</text>
<text class="a" x="730.0" y="973.0" text-anchor="middle">同时写 TaskReported（又回到 ①）</text>
<rect x="980" y="908" width="440" height="88" rx="10" fill="#eaf7ed" stroke="#3c8b53" stroke-width="1.4"/>
<text class="n" x="1200.0" y="932.0" text-anchor="middle">写协程 → WebSocket → 客户端</text>
<text class="a" x="1200.0" y="954.0" text-anchor="middle">断开后客户端重连，</text>
<text class="a" x="1200.0" y="973.0" text-anchor="middle">按 seq 重新读页面补上</text>
<path d="M260.0,870.0 L260.0,905.0" stroke="#7a7f8c" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M730.0,870.0 L730.0,905.0" stroke="#7a7f8c" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M1200.0,870.0 L1200.0,905.0" stroke="#7a7f8c" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text class="note" x="40.0" y="1040.0" text-anchor="start">一共三个队列：① ② 在 SQLite 里，和会话日志同一个事务写入，重启不丢；③ 在内存里，每条连接一个，丢了就靠重读补。</text>
<text class="note" x="40.0" y="1064.0" text-anchor="start">总线不保存工作：它只按顺序叫醒两个调度器和网关。调度器回 SQLite 取队列，网关把事件放进这条连接自己的 outbox。</text>
<text class="note" x="40.0" y="1088.0" text-anchor="start">普通工具（不是后台工具）不进任何队列：Runner 在 ① 给它的槽位里直接执行，结果写回日志。</text>
</svg>
